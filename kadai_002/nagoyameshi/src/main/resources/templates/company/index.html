<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">    
   <head>
       <div th:replace="~{fragment :: meta}"></div>   
            
       <div th:replace="~{fragment :: styles}"></div>
          
       <title>店舗詳細</title>   
   </head>
   <body>
       <div class="samuraitravel-wrapper">
           <!-- ヘッダー -->
           <div th:replace="~{fragment :: header}"></div>
           
           <main>
               <div class="container pt-4 pb-5 samuraitravel-container">
                   <div class="row justify-content-center">
                       <div class="col-xxl-9 col-xl-10 col-lg-11">
						   
                           <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                               <ol class="breadcrumb mb-0 d-flex justify-content-between align-items-center w-100">
								   <div class="d-flex align-items-center">                       
		                               <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
		                               <li class="breadcrumb-item active" aria-current="page">会社情報</li>
                                   </div>
                               </ol>
                           </nav> 
                           
                           <h1 class="mb-4 text-center" th:text="会社概要"></h1>                                                           
                                                                                                   
                           <div class="d-flex justify-content-end align-items-end mb-3" sec:authorize="hasRole('ROLE_ADMIN')">                    
                               <div>
                                   <a th:href="@{/company/edit}">編集</a>                                    
                               </div>
                           </div>
                           
                           <div class="mb-4">
                              <img class="w-100" th:src="@{/images/logo2.png}"  alt="SAMURAI Travel">
                 
                           </div> 
                           
                           <div class="container">  
                               <div class="row">
                                   <div class="col-lg-8 container mb-4">
									               
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">会社名</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${companyInfo.getName()}"></span>
                                           </div>
                                       </div>                    
                   						
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">所在地</span>
                                           </div>
                   
                                           <div class="col">
                                               <span class="samuraitravel-pre-wrap" th:text="${companyInfo.getAddress()}"></span>
                                           </div>
                                       </div>
                   
                                       <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">代表者</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${companyInfo.getRepresentative()}"></span>
                                           </div>
                                       </div> 
                                       
                                      <div class="row pb-2 mb-2 border-bottom">
                                           <div class="col-4">
                                               <span class="fw-bold">設立</span>
                                           </div>
                   
                                           <div class="col">
                                               <span th:text="${companyInfo.getEstabilishedAt()}"></span>
                                           </div>
                                      </div>
                                                            
                                   </div>                                                                              
                               </div>                                                                                             
                           	</div>
                           	 
                            <iframe class="w-100"
		                    th:src="${companyInfo.getMapSrc()}"
		                    style="border:0;" allowfullscreen="" loading="lazy">
		                	</iframe>         							
                  
                       </div>
                   </div>
               </div>
           </main>
        </div>   
           <!-- フッター -->
           <div th:replace="~{fragment :: footer}"></div>
       
       
       <div th:replace="~{fragment :: scripts}"></div> 
       
  
               
 </body>
</html>
