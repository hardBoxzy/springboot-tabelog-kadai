<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

   <head>
       <div th:replace="~{fragment :: meta}"></div>   
            
       <div th:replace="~{fragment :: styles}"></div> 
                <!-- slickの読み込み -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
       <title>ログイン</title>       
   </head>
   <body>
       <div class="samuraitravel-wrapper">
           <!-- ヘッダー -->
           <div th:replace="~{fragment :: header}"></div>
           
           <main>
               <div class="container pt-4 pb-5 samuraitravel-container">
                   <div class="row justify-content-center">        
                       <div class="col-xl-3 col-lg-4 col-md-5 col-sm-7">                            
                           <h1 class="mb-4 text-center">ログイン</h1>            
                       
                           <div th:if="${param.error}" class="alert alert-danger">
                               メールアドレスまたはパスワードが正しくありません。
                           </div>
                           
                           <form th:action="@{/login}" method="post">
                               <div class="form-group mb-3">
                                   <input type="text" class="form-control" name="username" autocomplete="email" placeholder="メールアドレス" autofocus>
                               </div>
                               <div class="form-group mb-3">
                                   <input type="password" class="form-control" name="password" autocomplete="new-password" placeholder="パスワード">
                               </div>
                               
                               <div class="form-group d-flex justify-content-center my-4">
                                   <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn">ログイン</button>
                               </div>
                           </form>
                           
							 <div class="d-flex align-items-center justify-content-between pb-2 border-bottom w-100">
							    <div>
							        <a th:href="@{/signup}">
							            会員登録
							        </a>
							    </div>
							    <div class="text-end">
							        <a class="text-danger" th:href="@{/userPasswordEdit}">
							            パスワード忘れた方
							        </a>
							    </div>
							</div>
                           
                            <form th:action="@{/login}" method="post">
                               <div class="form-group mb-2 ">
                                   <input type="hidden" class="form-control" name="username" autocomplete="email"  autofocus value="yoshikatsu.samurai@example.com">
                               </div>
                               <div class="form-group mb-3">
                                   <input type="hidden" class="form-control" name="password" autocomplete="new-password" value="password">
                               </div>
                               
                               <div class="form-group d-flex justify-content-center my-4 ">
                                   <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn">仮アカウント(通常会員)でログイン</button>
                               </div>
                           </form>
                           
                           <form th:action="@{/login}" method="post">
                               <div class="form-group mb-3">
                                   <input type="hidden" class="form-control" name="username" autocomplete="email"  autofocus value="taro.samurai@example.com">
                               </div>
                               <div class="form-group mb-3">
                                   <input type="hidden" class="form-control" name="password" autocomplete="new-password" value="password">
                               </div>
                               
                               <div class="form-group d-flex justify-content-center my-4">
                                   <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn">仮アカウント(有料会員)でログイン</button>
                               </div>
                           </form>
                           
                           <form th:action="@{/login}" method="post">
                               <div class="form-group mb-3">
                                   <input type="hidden" class="form-control" name="username" autocomplete="email"  autofocus value="hanako.samurai@example.com">
                               </div>
                               <div class="form-group mb-3">
                                   <input type="hidden" class="form-control" name="password" autocomplete="new-password" value="password">
                               </div>
                               
                               <div class="form-group d-flex justify-content-center my-4">
                                   <button type="submit" class="btn text-white shadow-sm w-100 samuraitravel-btn">仮アカウント(管理者)でログイン</button>
                               </div>
                           </form>
                                                                            
                       </div>
                       
					<!-- 全体を囲むクラス名を infinite-slider-container に変更 -->
					<div class="infinite-slider-container over-back-image mt-5 ">                                       
					    <!-- 実際に横に動くトラック -->
					    <div class="carousel-linear">
					        
					        <!-- 【1回目】1～7のイラストを出力 -->
					        <div class="slider-item" th:each="i : ${#numbers.sequence(1, 7)}">
					            <img th:src="@{|/images/illustration${i}.png|}" alt="イラスト画像">              
					        </div>                                               
					        
					        <!-- 【2回目】ループを繋げるために、全く同じ1～7をもう一度出力（コピー） -->
					        <div class="slider-item" th:each="i : ${#numbers.sequence(1, 7)}">
					            <img th:src="@{|/images/illustration${i}.png|}" alt="イラスト画像">              
					        </div>                                               
					        <!-- 【3回目】ループを繋げるために、全く同じ1～7をもう一度出力（コピー） -->
					        <div class="slider-item" th:each="i : ${#numbers.sequence(1, 7)}">
					            <img th:src="@{|/images/illustration${i}.png|}" alt="イラスト画像">              
					        </div> 
					    </div>
					</div>
                      
                   </div>
               </div>             
           </main>
          
           <!-- フッター -->
           <div th:replace="~{fragment :: footer}"></div>
        </div>    
       
       <div th:replace="~{fragment :: scripts}"></div>  
       <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

       		  <!-- slickの読み込み -->
		  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
		
		  <script th:src="@{/js/carousel.js}"></script>       
   </body>
</html>
