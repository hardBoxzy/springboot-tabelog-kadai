<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragment :: meta}"></div>

	<div th:replace="~{fragment :: styles}"></div>

	<title>予約内容確認</title>
</head>

<body>
	<div class="samuraitravel-wrapper">
		<!-- ヘッダー -->
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container pb-5 samuraitravel-container">
				<div class="row justify-content-center">
					<div class="col-xl-8 col-lg-8 col-md-8">
						<nav class="my-3" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
							<ol class="breadcrumb mb-0">
								<li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
								<li class="breadcrumb-item active" aria-current="page"><a th:href="@{/user}">会員情報</a>
								</li>
								<li class="breadcrumb-item active" aria-current="page">有料会員加入</li>
							</ol>
						</nav>
						<div th:if="${param.subscribed}" class="alert alert-info">
							支払いが完了しました。
						</div>
						<div th:if="${param.canceled}" class="alert alert-info">
							支払いがキャンセルさせました。
						</div>
						<h1 class="mb-4 text-center">有料会員特典</h1>

						<div class="row row-cols-lg-3 row-cols-3 g-3 mb-5">
							<div class="col">
								<a class="link-dark samuraitravel-card-link">
									<div class="card h-100">
										<div class="card-body">
											<h3 class="card-title mb-3 text-center">&#x1F451;レビュー投稿</h3>
										</div>
										<img th:src="@{/images/subscription1.png}"
											class="card-img-top samuraitravel-vertical-card-image" alt="店舗画像">

									</div>
								</a>
							</div>

							<div class="col">
								<a class="link-dark samuraitravel-card-link">
									<div class="card h-100">
										<div class="card-body">
											<h3 class="card-title mb-3 text-center" th:text="'&#x1F451;店舗予約'"></h3>
										</div>
										<img th:src="@{/images/subscription2.png}"
											class="card-img-top samuraitravel-vertical-card-image" alt="店舗画像">

									</div>
								</a>
							</div>
							<div class="col">
								<a class="link-dark samuraitravel-card-link">
									<div class="card h-100">
										<div class="card-body">
											<h3 class="card-title mb-3 text-center">&#x1F451;お気に入り追加</h3>
										</div>
										<img th:src="@{/images/subscription3.png}"
											class="card-img-top samuraitravel-vertical-card-image" alt="店舗画像">

									</div>
								</a>
							</div>
						</div>

						<div class="container mb-4">
							<div class="row pb-2 mb-2 border-bottom w-50 mx-auto text-cente fs-4">
								<div class="col-6">
									<span class="fw-bold">月額</span>
								</div>

								<div class="col">
									<span>300円</span>
								</div>

							</div>
						</div>
						
						<div class="d-flex justify-content-center ">
							<button id="paymentButton"
								class="btn text-white shadow-sm w-50 samuraitravel-btn fs-4 ">決済する</button>
						</div>
						<div class="text-center mt-4 mb-4">
						    <span class="fs-6 text-muted">※いつでも解約できます。</span>
						</div>
					</div>
				</div>
			</div>
	</div>
	</main>

	<!-- フッター -->
	<div th:replace="~{fragment :: footer}"></div>
	</div>

	<div th:replace="~{fragment :: scripts}"></div>
	<script src="https://js.stripe.com/v3"></script>
	<script th:inline="javascript">
		const sessionId = /*[[${sessionId}]]*/"sessionId";                
	</script>
	<script th:src="@{/js/stripe.js}"></script>
</body>

</html>
